<svg xmlns="http://www.w3.org/2000/svg" width="638" height="827" viewBox="0 0 638 827">
  <rect x="0" y="0" width="638" height="827" fill="#ffffff"/>
  <rect x="8" y="8" width="622" height="803" fill="none" stroke="#000000" stroke-width="3"/>

  <text x="24" y="46" font-family="DejaVuSans-Bold" font-size="26" fill="#000000">ThorVG text check</text>
  <rect x="24" y="58" width="590" height="2" fill="#000000"/>

  <!-- ============ inherited font properties ============ -->
  <!-- Every caption carries its own font-family and font-size, so this sheet
       stays readable even when the thing it is testing is broken. -->
  <text x="24" y="86" font-family="DejaVuSans-Bold" font-size="15" fill="#000000">1. Inherited font-size / font-family: each pair must match</text>
  <text x="24" y="110" font-family="DejaVuSans" font-size="12" fill="#000000">inherited form</text>
  <text x="330" y="110" font-family="DejaVuSans" font-size="12" fill="#000000">explicit reference</text>
  <rect x="318" y="118" width="2" height="326" fill="#000000"/>

  <text x="24" y="138" font-family="DejaVuSans" font-size="13" fill="#000000">a. g carries both, text carries neither</text>
  <g font-family="DejaVuSans" font-size="34">
    <text x="24" y="174" fill="#000000">Hxp 34</text>
  </g>
  <text x="330" y="174" font-family="DejaVuSans" font-size="34" fill="#000000">Hxp 34</text>

  <text x="24" y="202" font-family="DejaVuSans" font-size="13" fill="#000000">b. nested g: inner size wins, family from outer</text>
  <g font-family="DejaVuSans" font-size="60">
    <g font-size="34">
      <text x="24" y="238" fill="#000000">Hxp 34</text>
    </g>
  </g>
  <text x="330" y="238" font-family="DejaVuSans" font-size="34" fill="#000000">Hxp 34</text>

  <text x="24" y="266" font-family="DejaVuSans" font-size="13" fill="#000000">c. text's own size beats the g's 60</text>
  <g font-family="DejaVuSans" font-size="60">
    <text x="24" y="302" font-size="34" fill="#000000">Hxp 34</text>
  </g>
  <text x="330" y="302" font-family="DejaVuSans" font-size="34" fill="#000000">Hxp 34</text>

  <text x="24" y="330" font-family="DejaVuSans" font-size="13" fill="#000000">d. style="" on the text itself</text>
  <text x="24" y="366" font-family="DejaVuSans" style="font-size:34px" fill="#000000">Hxp 34</text>
  <text x="330" y="366" font-family="DejaVuSans" font-size="34" fill="#000000">Hxp 34</text>

  <text x="24" y="394" font-family="DejaVuSans" font-size="13" fill="#000000">e. style="" on the g, bold inherited down</text>
  <g style="font-family:DejaVuSans-Bold; font-size:34">
    <text x="24" y="430" fill="#000000">Hxp 34</text>
  </g>
  <text x="330" y="430" font-family="DejaVuSans-Bold" font-size="34" fill="#000000">Hxp 34</text>

  <rect x="24" y="452" width="590" height="2" fill="#000000"/>

  <!-- ============ character references ============ -->
  <!-- A caption shows what the FILE says, escaped one level so it prints
       literally; the line under it is what must come out. -->
  <text x="24" y="480" font-family="DejaVuSans-Bold" font-size="15" fill="#000000">2. Character references: each result must match its source</text>

  <text x="24" y="506" font-family="DejaVuSans" font-size="13" fill="#000000">f. file: AT&amp;amp;T</text>
  <text x="24" y="538" font-family="DejaVuSans" font-size="28" fill="#000000">AT&amp;T</text>

  <text x="24" y="562" font-family="DejaVuSans" font-size="13" fill="#000000">g. file: &amp;#65;&amp;#66;&amp;#67;</text>
  <text x="24" y="594" font-family="DejaVuSans" font-size="28" fill="#000000">&#65;&#66;&#67;</text>

  <text x="24" y="618" font-family="DejaVuSans" font-size="13" fill="#000000">h. file: 25&amp;#176;C and 10&amp;#x3A9;</text>
  <text x="24" y="650" font-family="DejaVuSans" font-size="28" fill="#000000">25&#176;C  10&#x3A9;</text>

  <text x="24" y="674" font-family="DejaVuSans" font-size="13" fill="#000000">i. file: &amp;amp;lt;   one pass, so NOT a less-than sign</text>
  <text x="24" y="706" font-family="DejaVuSans" font-size="28" fill="#000000">&amp;lt;</text>

  <text x="24" y="730" font-family="DejaVuSans" font-size="13" fill="#000000">j. file: &amp;lt;   left alone on purpose, prints the same as i</text>
  <text x="24" y="762" font-family="DejaVuSans" font-size="28" fill="#000000">&lt;</text>

  <text x="24" y="794" font-family="DejaVuSans" font-size="12" fill="#000000">638 x 827 dots = 54 x 70 mm at 300 DPI, so print svg -media roll54x70 renders it at scale 1.</text>
</svg>
