dependencies:
  idf:
    version: ">=5.0.0"
  espressif/mdns: ^1
  # The USB Host Library, which drives the label printer off the S3's OTG port.
  # A managed dependency and not a COMPONENT_REQUIRES because IDF 6.0 moved the
  # `usb` component out of the framework and into the registry; on 5.x this was
  # a built-in and a REQUIRES line was enough.
  espressif/usb: "^1.4.0"
  # The SVG renderer. A managed dependency and not a board fragment, because
  # ESP-IDF resolves REQUIRES in a pass that cannot see -DBOARD - see the note
  # in main/CMakeLists.txt.
  #
  # The floor is 1.1.2 and not 1.1.0 because FONT SUPPORT NEEDS IT. Every
  # earlier release passes '-D__linux__' to ThorVG's meson build, and ThorVG
  # reads that as "mmap is available": its font loader includes <sys/mman.h>,
  # which ESP-IDF has not got, so CONFIG_THORVG_TTF_LOADER_SUPPORT=y fails to
  # compile. An SVG <text> element with no font renders as nothing at all, so
  # this is not optional - and a version range that lets the solver pick 1.1.0
  # is a build that breaks for a reason no error message mentions.
  #
  # This was a fork pinned to a commit until 2026-09-20. The one-token fix was
  # offered upstream, merged as espressif/idf-extra-components 6cbb7fab, and
  # released in 1.1.2 - so the fork is gone and this is the registry again.
  espressif/thorvg: "~1.1.2"
# esp_websocket_client is deliberately absent: the relay drives a WebSocket through
# the built-in tcp_transport layer instead, so the reading happens on the task that
# runs the command. See Application/RelayManager/RelaySocket.h.
